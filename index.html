<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#172635" />
    <script>
      (() => {
        let savedTheme;
        try { savedTheme = localStorage.getItem('mottameister-theme'); } catch {}
        const theme = savedTheme === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#172635' : '#e8eef4';
      })();
    </script>
    <meta name="description" content="@mottameister — Toca da Coruja, comunidade, jogos e projetos." />
    <meta property="og:title" content="@mottameister — Toca da Coruja" />
    <meta property="og:description" content="Servidor Cobblemon, campanha própria e uma comunidade que já virou família." />
    <meta property="og:image" content="https://mottameister.xyz/preview.png" />
    <meta property="og:url" content="https://mottameister.xyz" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>@mottameister — Toca da Coruja</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
