<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Honey’s Adventure • MottaMeister</title>

  <meta name="description" content="Extra photos from Honey’s adventure with Dom, Charlie and the family." />
  <meta name="theme-color" content="#b517ff" />

  <style>
    :root {
      --bg: #090711;
      --text: #f7f2ff;
      --muted: #b9a9cb;
      --purple: #b517ff;
      --pink: #ff4fd8;
      --blue: #43d9ff;
      --card: rgba(255,255,255,0.075);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;

      background:
        radial-gradient(circle at 15% 10%, rgba(181,23,255,0.35), transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(67,217,255,0.25), transparent 45%),
        radial-gradient(circle at 50% 80%, rgba(255,79,216,0.15), transparent 50%),
        linear-gradient(180deg, #05030a 0%, #090711 60%, #0c0816 100%);

      background-size: 140% 140%;
      animation: bgBreath 12s ease-in-out infinite alternate;
    }

    @keyframes bgBreath {
      from { background-position: 0% 0%; }
      to { background-position: 100% 100%; }
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.22) 1px, transparent 1px),
        radial-gradient(circle, rgba(181,23,255,0.18) 1px, transparent 1px),
        radial-gradient(circle, rgba(67,217,255,0.16) 1px, transparent 1px);
      background-size: 80px 80px, 130px 130px, 170px 170px;
      background-position: 0 0, 30px 40px, 80px 20px;
      opacity: 0.35;
      animation: particlesMove 30s linear infinite;
      z-index: 0;
    }

    @keyframes particlesMove {
      from { transform: translateY(0); }
      to { transform: translateY(-120px); }
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: min(1100px, calc(100% - 28px));
      margin: 0 auto;
      padding: 34px 0 70px;
    }

    .hero {
      text-align: center;
      padding: 20px 10px 10px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      padding: 10px 14px;
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(16px);
      transition: transform .2s ease, background .2s ease;
    }

    .back-link:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.12);
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 8vw, 76px);
      line-height: .95;
      letter-spacing: -0.06em;
    }

    .subtitle {
      max-width: 720px;
      margin: 16px auto 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
    }

    .panel {
      margin: 30px auto 0;
      padding: 16px;
      border-radius: 28px;
      background: linear-gradient(
        180deg,
        rgba(255,255,255,0.09),
        rgba(255,255,255,0.045)
      );
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow:
        0 24px 80px rgba(181,23,255,0.22),
        inset 0 1px 0 rgba(255,255,255,0.08);
      backdrop-filter: blur(18px);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .gallery a {
      display: block;
      border-radius: 20px;
      overflow: hidden;
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow:
        0 12px 40px rgba(0,0,0,0.35),
        0 0 18px rgba(181,23,255,0.15);
      transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;
    }

    .gallery a:hover {
      transform: translateY(-4px) scale(1.015);
      border-color: rgba(255,255,255,0.22);
      box-shadow:
        0 20px 50px rgba(0,0,0,0.45),
        0 0 30px rgba(181,23,255,0.28);
    }

    .gallery img {
      width: 100%;
      height: 310px;
      object-fit: cover;
      display: block;
    }

    .footer {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-top: 28px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 560px) {
      .wrap {
        width: min(100% - 22px, 1100px);
        padding-top: 24px;
      }

      .panel {
        padding: 12px;
        border-radius: 24px;
      }

      .gallery {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .gallery img {
        height: auto;
        max-height: none;
      }

      .subtitle {
        font-size: 15px;
      }
    }
  </style>
</head>
