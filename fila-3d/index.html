<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Fila 3D · Murilo &amp; Gabi</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/fila-3d/printer-favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/fila-3d/printer-favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/fila-3d/printer-apple-touch-icon.png">
  <link rel="stylesheet" href="/fila-3d/style.css">
</head>
<body>
  <main>
    <header><a class="brand" href="/">mottameister</a></header>
    <section class="hero">
      <h1>Fila 3D</h1>
      <button id="add" class="primary" type="button">＋ Nova impressão</button>
    </section>
    <section class="camera-section" aria-label="Câmera da impressora">
      <div class="camera-heading">
        <h2>Câmera da impressora</h2>
        <span id="camera-state" class="camera-state">Desconectada</span>
      </div>
      <div class="camera-screen">
        <video id="camera" aria-label="Vídeo ao vivo da impressora 3D" autoplay muted playsinline controls disablepictureinpicture hidden></video>
        <div id="camera-empty"><strong>A câmera está desconectada</strong></div>
      </div>
    </section>
    <section class="queue">
      <div class="section-heading">
        <h2>Na fila <span id="count">—</span></h2>
        <button id="refresh" class="quiet" type="button">↻ Atualizar</button>
      </div>
      <p id="message" role="status" aria-live="polite"></p>
      <div id="list"></div>
      <details id="history">
        <summary>Concluídas <span id="done-count"></span></summary>
        <div id="done"></div>
      </details>
    </section>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <form id="form">
      <div class="modal-heading">
        <h2 id="dialog-title">Nova impressão</h2>
        <button type="button" id="close" class="quiet" aria-label="Fechar">✕</button>
      </div>
      <label>Nome do projeto<input name="name" maxlength="120" required autocomplete="off"></label>
      <label>Link do projeto ou Instagram <small>opcional</small><input name="link" type="url" maxlength="2048" placeholder="https://..."></label>
      <fieldset class="filament-picker">
        <legend>Cor do filamento <small>opcional</small></legend>
        <div id="filament-options" class="swatches"></div>
        <p class="filament-selection">
          <output id="filament-name" aria-live="polite">Sem preferência</output>
          <button id="clear-filament" class="quiet" type="button" hidden>Limpar</button>
        </p>
      </fieldset>
      <div class="fields">
        <label>Prioridade<select name="priority"><option value="1">Sem pressa</option><option value="2" selected>Normal</option><option value="3">Quero logo!</option></select></label>
        <label>Solicitante<select name="owner" id="owner"><option>Murilo</option><option>Gabi</option><option value="other">Outro</option></select></label>
      </div>
      <label id="owner-other-label" hidden>Nome de quem está pedindo<input id="owner-other" name="owner_other" maxlength="60" disabled></label>
      <p id="form-error" role="alert"></p>
      <button class="primary" id="save">Entrar na fila</button>
    </form>
  </dialog>
  <script type="module" src="/fila-3d/app.js"></script>
</body>
</html>
