<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Propostas | @mottameister</title>
  <meta name="description" content="Acesso restrito a propostas comerciais do @mottameister." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#f6f1ff" />

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

  <style>
    :root {
      --bg: #fbf8ff;
      --ink: #17111f;
      --muted: #655b76;
      --line: rgba(64, 45, 91, .14);
      --purple: #9b5cff;
      --blue: #2f8cff;
      --pink: #ec5cc9;
      --shadow: 0 24px 70px rgba(90, 45, 148, .14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 16%, rgba(155, 92, 255, .24), transparent 36%),
        radial-gradient(circle at 78% 24%, rgba(47, 140, 255, .18), transparent 34%),
        radial-gradient(circle at 54% 92%, rgba(236, 92, 201, .12), transparent 38%),
        linear-gradient(180deg, #fff, var(--bg));
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(64, 45, 91, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(64, 45, 91, .045) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(180deg, #000, transparent 72%);
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(480px, 100%);
      padding: 28px;
      border-radius: 28px;
      background: rgba(255, 255, 255, .78);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--purple);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }

    .brand::before {
      content: "";
      width: 32px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--purple), var(--blue));
    }

    h1 {
      margin: 18px 0 10px;
      font-size: clamp(34px, 8vw, 54px);
      line-height: .92;
      letter-spacing: -.06em;
    }

    p {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.55;
    }

    form {
      display: grid;
      gap: 10px;
    }

    input {
      width: 100%;
      min-height: 52px;
      padding: 0 16px;
      border-radius: 16px;
      border: 1px solid var(--line);
      color: var(--ink);
      background: rgba(255,255,255,.88);
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: rgba(155, 92, 255, .58);
      box-shadow: 0 0 0 4px rgba(155, 92, 255, .12);
    }

    button {
      min-height: 52px;
      padding: 0 18px;
      border-radius: 16px;
      border: 0;
      color: #fff;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      font: inherit;
      font-weight: 950;
      cursor: pointer;
      box-shadow: 0 16px 36px rgba(86, 79, 230, .23);
    }

    .error {
      min-height: 20px;
      margin: 4px 0 0;
      color: #b42352;
      font-size: 14px;
      font-weight: 850;
    }

    .back {
      display: inline-flex;
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 850;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="brand">@mottameister</span>
    <h1>Área de propostas</h1>
    <p>Digite a senha recebida para acessar a proposta comercial relacionada.</p>

    <form data-form>
      <input type="password" name="password" autocomplete="current-password" placeholder="Senha de acesso" aria-label="Senha de acesso" required autofocus>
      <button type="submit">Entrar</button>
      <p class="error" data-error aria-live="polite"></p>
    </form>

    <a class="back" href="/">Voltar para mottameister.xyz</a>
  </main>

  <script>
    const form = document.querySelector("[data-form]");
    const error = document.querySelector("[data-error]");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const password = String(new FormData(form).get("password")).trim();
      if (!password) {
        error.textContent = "Digite a senha recebida para continuar.";
        return;
      }

      sessionStorage.setItem("motta-proposal-passphrase", password);
      window.location.href = "/propostas/trix/";
    });
  </script>
</body>
</html>
