<!doctype html>
<html lang="pt-BR" data-theme="dark" data-lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proposta | @mottameister</title>
  <meta name="description" content="Proposta comercial com acesso restrito." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#f6f1ff" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="stylesheet" href="/site-controls.css">

  <style>
    :root {
      --bg: #fbf8ff;
      --paper: rgba(255, 255, 255, .78);
      --paper-strong: #ffffff;
      --ink: #17111f;
      --muted: #655b76;
      --line: rgba(64, 45, 91, .14);
      --purple: #9b5cff;
      --pink: #ec5cc9;
      --blue: #2f8cff;
      --cyan: #23bdd9;
      --green: #39a86b;
      --gold: #c48216;
      --shadow: 0 24px 70px rgba(90, 45, 148, .14);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(155, 92, 255, .24), transparent 34%),
        radial-gradient(circle at 86% 18%, rgba(47, 140, 255, .18), transparent 32%),
        radial-gradient(circle at 52% 96%, rgba(236, 92, 201, .13), transparent 38%),
        linear-gradient(180deg, #fff 0%, var(--bg) 42%, #f2f7ff 100%);
      min-height: 100vh;
    }

    body.is-locked { overflow: hidden; }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(64, 45, 91, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(64, 45, 91, .045) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(180deg, #000, transparent 76%);
    }

    a { color: inherit; }

    .gate {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 16%, rgba(155, 92, 255, .24), transparent 36%),
        radial-gradient(circle at 78% 24%, rgba(47, 140, 255, .18), transparent 34%),
        linear-gradient(180deg, #fff, #f7f1ff);
    }

    .gate[hidden] { display: none; }

    .gate-card {
      width: min(460px, 100%);
      padding: 28px;
      border-radius: 28px;
      background: rgba(255, 255, 255, .78);
      border: 1px solid rgba(64, 45, 91, .14);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .gate-kicker,
    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--purple);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1.6px;
      text-transform: uppercase;
    }

    .gate-kicker::before,
    .kicker::before {
      content: "";
      width: 32px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--purple), var(--blue));
    }

    .gate h1 {
      margin: 18px 0 10px;
      font-size: clamp(32px, 8vw, 50px);
      line-height: .95;
      letter-spacing: -0.055em;
    }

    .gate p {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.55;
    }

    .gate-form {
      display: grid;
      gap: 10px;
    }

    .gate-form input {
      width: 100%;
      min-height: 52px;
      padding: 0 16px;
      border-radius: 16px;
      border: 1px solid var(--line);
      color: var(--ink);
      background: rgba(255,255,255,.88);
      font: inherit;
      outline: none;
    }

    .gate-form input:focus {
      border-color: rgba(155, 92, 255, .58);
      box-shadow: 0 0 0 4px rgba(155, 92, 255, .12);
    }

    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 52px;
      padding: 0 18px;
      border-radius: 16px;
      border: 0;
      color: #fff;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      font: inherit;
      font-weight: 900;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 16px 36px rgba(86, 79, 230, .23);
    }

    .gate-error {
      min-height: 20px;
      margin: 4px 0 0;
      color: #b42352;
      font-size: 14px;
      font-weight: 800;
    }

    .site {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
      position: relative;
      z-index: 1;
    }

    .nav {
      position: sticky;
      top: 12px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255,255,255,.72);
      box-shadow: 0 18px 50px rgba(90, 45, 148, .08);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 950;
      letter-spacing: -.04em;
      text-decoration: none;
    }

    .brand img {
      width: 34px;
      height: 34px;
      object-fit: cover;
      border-radius: 999px;
      border: 2px solid #fff;
      box-shadow: 0 0 0 2px rgba(155, 92, 255, .28);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav-links a,
    .ghost {
      padding: 10px 12px;
      border-radius: 14px;
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 850;
    }

    .ghost {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.55);
      cursor: pointer;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(320px, .9fr);
      gap: 24px;
      align-items: stretch;
      padding: 74px 0 30px;
    }

    .hero-copy {
      padding: 34px 0;
    }

    h1,
    h2,
    h3,
    p { overflow-wrap: anywhere; }

    .hero h1 {
      max-width: 760px;
      margin: 18px 0 18px;
      font-size: clamp(46px, 8vw, 88px);
      line-height: .9;
      letter-spacing: -0.065em;
    }

    .lead {
      max-width: 680px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(18px, 2.1vw, 23px);
      line-height: 1.42;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 28px;
    }

    .hero-panel {
      min-height: 430px;
      padding: 20px;
      border-radius: 30px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,255,255,.58));
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      display: grid;
      align-content: space-between;
      overflow: hidden;
      position: relative;
    }

    .hero-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 22% 14%, rgba(155, 92, 255, .18), transparent 32%),
        radial-gradient(circle at 90% 22%, rgba(47, 140, 255, .16), transparent 34%);
      pointer-events: none;
    }

    .hero-panel > * { position: relative; }

    .mini-browser {
      border-radius: 22px;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid var(--line);
      box-shadow: 0 20px 54px rgba(33, 20, 54, .12);
    }

    .mini-top {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 14px;
      background: #f4effb;
      border-bottom: 1px solid var(--line);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 16px 0 0 var(--gold), 32px 0 0 var(--green);
    }

    .mini-feed {
      padding: 18px;
      display: grid;
      gap: 12px;
    }

    .mini-line {
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--purple), var(--blue));
    }

    .mini-card {
      min-height: 94px;
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgba(155, 92, 255, .15), rgba(47, 140, 255, .10)),
        #fbf8ff;
      border: 1px solid var(--line);
      padding: 14px;
      display: grid;
      align-content: end;
    }

    .mini-card strong {
      font-size: 28px;
      letter-spacing: -.05em;
    }

    .mini-card span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .section {
      padding: 58px 0 0;
    }

    .section-head {
      display: grid;
      grid-template-columns: minmax(0, .85fr) minmax(260px, .45fr);
      gap: 24px;
      align-items: end;
      margin-bottom: 18px;
    }

    .section h2 {
      margin: 12px 0 0;
      font-size: clamp(34px, 5vw, 58px);
      line-height: .96;
      letter-spacing: -0.055em;
    }

    .section-note {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 16px;
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }

    .card {
      position: relative;
      min-height: 150px;
      padding: 20px;
      border-radius: 24px;
      background: var(--paper);
      border: 1px solid var(--line);
      box-shadow: 0 18px 52px rgba(90, 45, 148, .08);
      overflow: hidden;
      backdrop-filter: blur(16px);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 18% 8%, color-mix(in srgb, var(--accent, var(--purple)) 22%, transparent), transparent 36%);
      pointer-events: none;
    }

    .card > * { position: relative; }

    .metric {
      --accent: var(--purple);
      display: grid;
      align-content: space-between;
      min-height: 172px;
    }

    .metric-value {
      font-size: clamp(34px, 4.5vw, 56px);
      line-height: .9;
      letter-spacing: -0.06em;
      font-weight: 950;
    }

    .metric-label {
      margin-top: 10px;
      color: var(--muted);
      font-weight: 850;
      line-height: 1.25;
    }

    .bar {
      height: 6px;
      width: 100%;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 28%, transparent);
      overflow: hidden;
      margin-bottom: 18px;
    }

    .bar span {
      display: block;
      height: 100%;
      width: var(--w);
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--blue));
    }

    .story-card h3,
    .package h3 {
      margin: 0 0 12px;
      font-size: 22px;
      letter-spacing: -.04em;
    }

    .story-card p,
    .package p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .audience-map {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-content: start;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--purple) 38%, var(--line));
      background: rgba(255,255,255,.58);
      color: #3b275c;
      font-size: 13px;
      font-weight: 900;
    }

    .proof {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .chart-card {
      min-height: 360px;
      padding: 22px;
    }

    .chart-row {
      display: grid;
      grid-template-columns: minmax(120px, 180px) 1fr minmax(66px, auto);
      align-items: center;
      gap: 12px;
      margin-top: 17px;
      font-weight: 850;
    }

    .track {
      height: 10px;
      border-radius: 999px;
      background: rgba(92, 63, 133, .10);
      overflow: hidden;
    }

    .track span {
      display: block;
      width: var(--w);
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--purple), var(--blue));
    }

    .value {
      text-align: right;
      color: var(--ink);
    }

    .community-layout {
      display: grid;
      grid-template-columns: .85fr 1.15fr;
      gap: 14px;
    }

    .formats {
      display: grid;
      grid-template-columns: .85fr 1.15fr;
      gap: 14px;
      align-items: stretch;
    }

    .phone-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .phone {
      min-height: 300px;
      border-radius: 28px;
      padding: 14px;
      background: #1d1730;
      color: #fff;
      box-shadow: 0 24px 54px rgba(29, 23, 48, .18);
    }

    .phone-screen {
      height: 100%;
      border-radius: 20px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.04)),
        #2b2342;
      padding: 16px;
      display: grid;
      align-content: space-between;
    }

    .phone-title {
      color: rgba(255,255,255,.72);
      font-size: 12px;
      font-weight: 900;
    }

    .phone-big {
      font-size: 34px;
      line-height: .95;
      letter-spacing: -.06em;
      font-weight: 950;
    }

    .package {
      --accent: var(--purple);
      display: grid;
      gap: 16px;
      min-height: 310px;
      align-content: start;
      border-top: 5px solid var(--accent);
    }

    .package ul,
    .note-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 10px;
    }

    .package li,
    .note-list li {
      color: var(--muted);
      line-height: 1.35;
      font-weight: 700;
    }

    .price {
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 28px;
      font-weight: 950;
      letter-spacing: -.05em;
    }

    .closing {
      min-height: 420px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, .45fr);
      gap: 18px;
      align-items: stretch;
      margin-top: 58px;
    }

    .closing-main {
      display: grid;
      align-content: center;
      min-height: 420px;
      padding: 34px;
      border-radius: 30px;
      color: #fff;
      background:
        radial-gradient(circle at 12% 12%, rgba(255,255,255,.2), transparent 30%),
        linear-gradient(135deg, #7a3ef2, #2f8cff);
      box-shadow: 0 28px 80px rgba(47, 140, 255, .22);
    }

    .closing-main h2 {
      max-width: 780px;
      margin: 0;
      font-size: clamp(42px, 7vw, 86px);
      line-height: .9;
      letter-spacing: -0.065em;
    }

    .closing-main p {
      max-width: 520px;
      margin: 20px 0 0;
      color: rgba(255,255,255,.82);
      font-size: 20px;
      line-height: 1.45;
    }

    .footer {
      padding: 34px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      text-align: center;
    }

    @media (max-width: 920px) {
      .hero,
      .section-head,
      .proof,
      .community-layout,
      .formats,
      .closing {
        grid-template-columns: 1fr;
      }

      .grid.cols-4,
      .grid.cols-3,
      .grid.cols-2,
      .audience-map {
        grid-template-columns: 1fr 1fr;
      }

      .hero { padding-top: 44px; }
    }

    @media (max-width: 640px) {
      .site { width: min(100% - 22px, 1160px); }
      .nav { align-items: flex-start; border-radius: 18px; }
      .nav-links a { display: none; }
      .grid.cols-4,
      .grid.cols-3,
      .grid.cols-2,
      .audience-map,
      .phone-row {
        grid-template-columns: 1fr;
      }

      .hero-panel,
      .card,
      .closing-main { border-radius: 22px; }

      .chart-row {
        grid-template-columns: 1fr;
        gap: 7px;
      }

      .value { text-align: left; }
    }
  </style>
</head>

  <script src="/site-controls.js"></script>
  <script>
    const STORAGE_KEY = "motta-proposal-passphrase";
    const root = document.getElementById("proposal-root");

    const fromBase64 = (value) => Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
    const processInstagramEmbeds = () => {
      if (!root.querySelector(".instagram-media")) return;

      const process = () => window.instgrm?.Embeds?.process?.();
      if (window.instgrm?.Embeds) {
        process();
        return;
      }

      if (document.querySelector('script[src*="instagram.com/embed.js"]')) return;

      const script = document.createElement("script");
      script.async = true;
      script.src = "https://www.instagram.com/embed.js";
      script.onload = process;
      document.body.appendChild(script);
    };

    const fail = () => {
      sessionStorage.removeItem(STORAGE_KEY);
      document.body.classList.remove("is-locked");
      root.innerHTML = '<main class="gate"><section class="gate-card"><span class="gate-kicker">Acesso restrito</span><h1>Senha necessária</h1><p>Volte para a área de propostas e digite a senha correta para abrir este conteúdo.</p><a class="button" href="/propostas/">Ir para o login</a></section></main>';
    };

    const decrypt = async () => {
      const password = sessionStorage.getItem(STORAGE_KEY);
      if (!password) {
        window.location.replace("/propostas/");
        return;
      }

      const payload = JSON.parse(document.getElementById("encrypted-proposal").textContent);
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: fromBase64(payload.salt), iterations: payload.iterations, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      const cipher = fromBase64(payload.ciphertext);
      const tag = fromBase64(payload.tag);
      const sealed = new Uint8Array(cipher.length + tag.length);
      sealed.set(cipher);
      sealed.set(tag, cipher.length);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromBase64(payload.iv) }, key, sealed);
      root.innerHTML = new TextDecoder().decode(plain);
      document.body.classList.remove("is-locked");
      processInstagramEmbeds();
    };

    decrypt().catch(fail);
  </script>
